services:
  - type: web
    name: agrishield-backend
    runtime: python
    rootDir: ml-model
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: API_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false
